[package]
name = "arc-map"
version = "0.1.1"
description = "Arc Raiders · The Dam 3D 地形查看器"
authors = ["you"]
license = ""
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "arc_map_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[features]
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2.11.2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json", "query"] }
cpal = "0.15.3"
symphonia = { version = "0.5.4", default-features = false, features = ["mp3", "wav", "pcm", "flac"] }
rtrb = "0.3"
tauri-plugin-dialog = "2"
tauri-plugin-global-shortcut = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
